<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title data-k="">Nahid Alom — অভিনন্দন</title><meta data-k="" name="claude:viewport-fit-sides" content="cover"><link data-k="" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&amp;family=Galada&amp;family=Hind+Siliguri:wght@400;500;600&amp;family=Tiro+Bangla:ital@0;1&amp;family=Atma:wght@400;500&amp;display=swap"><style data-k="">
/* Layout: one phone-width column of full-height pages (envelope, candle, greeting, memories, letter, wishes, gifts); admin and login are full-screen sheets over it. */
:root{
  --paper:#f7efe8;
  --ink:#4a2a2c;
  --ink-soft:#7d5a5a;
  --wine:#8a1c2b;
  --rose:#b42a3c;
  --blush:#e9cdc6;
  --gold:#b08d57;
  --night:#2b1316;
  --f-display:'Galada','Tiro Bangla',cursive;
  --f-text:'Tiro Bangla','Hind Siliguri',serif;
  --f-ui:'Hind Siliguri',system-ui,sans-serif;
  color-scheme:light;
}
html,body,#root{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-text);font-size:17px;line-height:1.75;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px}

.phone{position:relative;height:100%;max-width:460px;margin:0 auto;overflow:hidden;background:var(--paper);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .25  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  box-shadow:0 0 80px rgba(0,0,0,.5)}
.deco{position:absolute;pointer-events:none;z-index:0;filter:url(#wash)}
.deco.tl{top:-70px;left:-80px;width:300px;height:250px;background:radial-gradient(ellipse at 35% 35%,rgba(150,24,40,.92),rgba(170,40,55,.55) 48%,transparent 72%)}
.deco.br{bottom:-80px;right:-90px;width:320px;height:260px;background:radial-gradient(ellipse at 65% 65%,rgba(150,24,40,.92),rgba(170,40,55,.55) 48%,transparent 72%)}
.rose{position:absolute;pointer-events:none;z-index:1}
.rose.a{bottom:6px;right:4px;width:92px;transform:rotate(12deg)}
.rose.b{bottom:52px;right:62px;width:58px;transform:rotate(-20deg)}
.rose.c{bottom:-6px;right:84px;width:44px;transform:rotate(40deg)}
#petals{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

.stage{position:absolute;inset:0;z-index:2}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:64px 24px 76px;overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease,visibility 0s .6s}
.scene.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease .1s,transform .6s ease .1s,visibility 0s}
.scene>.mid{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;gap:20px}
.kicker{font-family:var(--f-text);font-style:italic;color:var(--ink-soft);font-size:17px;text-align:center}
.hint{font-family:var(--f-ui);font-size:14px;color:var(--ink-soft);letter-spacing:.02em;text-align:center;min-height:24px;transition:opacity .4s}
.btn{font-family:var(--f-ui);font-weight:500;font-size:16px;padding:11px 26px;border-radius:999px;background:var(--wine);color:#fff3ee;box-shadow:0 6px 16px rgba(138,28,43,.28);transition:transform .2s,opacity .4s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--wine);box-shadow:inset 0 0 0 1.5px var(--wine)}
.btn[hidden]{display:none}
a.btn{display:inline-block;text-decoration:none;text-align:center}
h2.title{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.3;color:var(--wine);margin:0;text-align:center}

.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ui);font-size:20px;color:var(--wine);background:rgba(247,239,232,.7);backdrop-filter:blur(4px)}
.iconbtn[hidden]{display:none}
.iconbtn.ghost0{opacity:0}
.dots{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:7px;padding:18px 0 max(18px,env(safe-area-inset-bottom,0px))}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(138,28,43,.22);transition:all .4s}
.dots i.on{background:var(--wine);width:22px;border-radius:5px}

/* vip polish */
#sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.vip{font-family:var(--f-ui);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#8a6a35;border:1px solid rgba(176,141,87,.55);padding:5px 14px;border-radius:99px;background:rgba(255,252,248,.65);text-align:center}
.cdt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(80vw,330px)}
.cdt div{background:rgba(255,252,248,.72);border-radius:12px;padding:8px 0 6px;box-shadow:inset 0 0 0 1px rgba(138,28,43,.16),0 6px 14px rgba(74,42,44,.08);text-align:center}
.cdt b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:28px;line-height:1.1;color:var(--wine);font-variant-numeric:tabular-nums}
.cdt span{font-family:var(--f-ui);font-size:12px;color:var(--ink-soft)}
.foil{background:linear-gradient(120deg,#6e1020 0%,#b42a3c 30%,#c9993f 50%,#b42a3c 70%,#6e1020 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.greet .en{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(28px,9.5vw,40px);line-height:1.1;margin:0 0 6px}
h2.title.foil,.end p.foil{color:transparent}

.portrait{width:128px;height:128px;border-radius:50%;object-fit:cover;margin:10px auto 4px;display:block;box-shadow:0 0 0 4px #fffaf4,0 0 0 6px #c9993f,0 14px 30px rgba(74,42,44,.3);position:relative}
.mainph{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:0 auto;display:block;box-shadow:0 0 0 3px #fffaf4,0 0 0 5px #c9993f}
.mv{display:flex;gap:6px}.mv .btn{padding:5px 12px;font-size:14px;flex:1}

.rgt{display:flex;gap:8px}
.adm select{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid #e1cfc6;border-radius:9px;padding:10px 12px;width:100%}
.lbn{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:rgba(247,239,232,.85);color:var(--wine);font-size:24px;display:grid;place-items:center;z-index:2}
.lbn.l{left:10px}.lbn.r{right:10px}
.lbs{position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(247,239,232,.9)!important;white-space:nowrap}
#qr{display:grid;place-items:center;padding:8px;background:#fff;border-radius:10px;width:fit-content;margin:0 auto}
.balloon{position:absolute;bottom:-90px;width:46px;height:58px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6),transparent 28%),var(--c);box-shadow:inset -7px -9px 14px rgba(0,0,0,.2);z-index:35;pointer-events:none;animation:balloonUp var(--t) ease-in forwards}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:54px;background:rgba(74,42,44,.4)}
.balloon::before{content:"";position:absolute;left:50%;top:97%;margin-left:-4px;border:4px solid transparent;border-top:0;border-bottom:7px solid var(--c)}
@keyframes balloonUp{to{transform:translate(var(--dx),-115vh) rotate(var(--r))}}

/* envelope */
.env{position:relative;width:min(80vw,330px);aspect-ratio:3/2;perspective:1000px;margin-top:10px}
.env>*{position:absolute}
.env .back{inset:0;background:#e6d8c7;border-radius:3px;box-shadow:0 18px 36px rgba(74,42,44,.22)}
.env .card{left:7%;right:7%;top:6%;height:90%;background:#fffaf4;border-radius:2px;box-shadow:0 1px 6px rgba(0,0,0,.15);z-index:2;transition:transform 1s cubic-bezier(.3,.7,.2,1) .5s;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:26px;color:var(--wine);line-height:1.3;padding:10px}
.env .pocket{inset:0;background:#f2e8dc;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:3;filter:drop-shadow(0 -1px 0 rgba(0,0,0,.06))}
.env .pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(0,0,0,.05))}
.env .flap{left:0;right:0;top:0;height:60%;background:#f7efe4;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;z-index:5;transition:transform .8s ease,z-index 0s .35s}
.env .seal{left:50%;top:58%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;z-index:6;background:radial-gradient(circle at 35% 30%,#d4475a,#8a1c2b 62%,#5f1220);box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.08);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:#f3c9c4;text-shadow:0 -1px 0 rgba(0,0,0,.4);transition:opacity .5s,transform .5s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0;transform:scale(.6)}
.env.open .card{transform:translateY(-62%)}
.env .band{background:linear-gradient(#b42a3c,#8a1c2b);z-index:7;transition:transform .9s cubic-bezier(.6,0,.3,1),opacity .6s .3s;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.env .band.h{left:-1%;right:-1%;top:41%;height:17%}
.env .band.v{top:-1%;bottom:-1%;left:41%;width:12%}
.env .bow{left:50%;top:50%;width:46%;margin:-19% 0 0 -23%;z-index:8;transition:transform .9s ease,opacity .7s .2s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.env.untied .band.h{transform:translateX(-120%);opacity:0}
.env.untied .band.v{transform:translateY(-130%);opacity:0}
.env.untied .bow{transform:translateY(90px) rotate(40deg);opacity:0}
.env .seal,.env .bow,.env .band{cursor:pointer}
.env:not(.untied) .seal{pointer-events:none}
.env.untied .band,.env.untied .bow{pointer-events:none}
.sprig{position:absolute;right:-8px;top:-22px;width:80px;z-index:9;pointer-events:none;transition:opacity .6s}
.env.untied .sprig{opacity:0}
.count{font-family:var(--f-ui);font-size:15px;color:var(--wine);background:rgba(138,28,43,.09);padding:5px 16px;border-radius:99px}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* candle polaroid */
.polaroid{background:#fffdfa;padding:12px 12px 44px;box-shadow:0 14px 30px rgba(74,42,44,.25);transform:rotate(-2.5deg);position:relative;width:min(68vw,270px)}
.polaroid .tape{position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(233,205,198,.8);transform:rotate(3deg)}
.photo{width:100%;aspect-ratio:1/1.08;background:radial-gradient(circle at 50% 40%,#5a3320,#1d0f0c 75%);position:relative;overflow:hidden}
.photo svg{width:100%;height:100%;display:block}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,190,90,.55),transparent 55%);transition:opacity 1.2s;mix-blend-mode:screen}
.out .glow{opacity:0}
.flame{transform-origin:100px 68px;animation:flick .18s infinite alternate;transition:opacity .5s}
.out .flame{opacity:0}
.smoke{opacity:0}
.out .smoke{animation:smoke 2.2s ease-out}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.92,1.06) rotate(2deg)}}
@keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.polaroid .cap{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:19px;color:var(--ink-soft)}

/* greeting */
.greet{position:relative;text-align:center;width:100%}
.greet .big{font-family:var(--f-display);font-size:clamp(54px,17vw,78px);line-height:1.15;color:var(--wine);margin:0;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.greet .big span{display:inline-block;opacity:0;transform:translateY(12px) scale(.94);animation:rise .8s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.greet .nm{font-family:var(--f-text);font-size:clamp(24px,7.4vw,32px);line-height:1.35;color:var(--ink);margin:14px 0 0;text-wrap:balance}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:6px 0}
.orn::before,.orn::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.bday{font-family:var(--f-ui);font-size:16px;color:var(--ink-soft);letter-spacing:.04em}
.bowcorner{position:absolute;top:-58px;left:-16px;width:68px;transform:rotate(-14deg)}

/* gallery */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;width:100%;max-width:380px;padding:6px 4px}
.grid .pl{background:#fffdfa;padding:8px 8px 30px;box-shadow:0 8px 18px rgba(74,42,44,.22);text-align:left;position:relative;transition:transform .3s}
.grid .pl:nth-child(odd){transform:rotate(-2.2deg)}
.grid .pl:nth-child(even){transform:rotate(2deg) translateY(10px)}
.grid .pl:active{transform:scale(1.03) rotate(0)}
.grid .pl img{display:block;width:100%;aspect-ratio:1/1.1;object-fit:cover;background:var(--blush)}
.grid .pl b{position:absolute;left:6px;right:6px;bottom:5px;font-family:var(--f-ui);font-weight:400;font-size:12.5px;line-height:1.3;color:var(--ink-soft);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb{position:fixed;inset:0;z-index:60;background:rgba(43,19,22,.88);display:grid;place-items:center;padding:24px}
.lb[hidden]{display:none}
.lb figure{margin:0;background:#fffdfa;padding:12px 12px 44px;max-width:min(92vw,440px);box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-1.5deg);position:relative}
.lb img{display:block;max-width:100%;max-height:64vh;margin:auto}
.lb figcaption{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--f-display);font-size:20px;color:var(--ink-soft)}

/* letter */
.paper{position:relative;width:100%;max-width:390px;background:#fbf5ec;padding:34px 26px 30px;box-shadow:0 12px 30px rgba(74,42,44,.2);
  clip-path:polygon(0 1%,4% 0,9% 1.2%,15% .2%,22% 1%,30% 0,38% 1%,46% .2%,55% 1.2%,63% 0,72% 1%,81% .1%,90% 1%,96% 0,100% 1%,100% 99%,95% 100%,88% 98.8%,79% 100%,70% 99%,61% 100%,50% 98.9%,41% 100%,32% 99%,22% 100%,12% 98.9%,5% 100%,0 99%)}
.paper::before{content:"";position:absolute;left:-30px;top:-30px;width:140px;height:120px;background:radial-gradient(ellipse at 40% 40%,rgba(150,24,40,.75),transparent 70%);filter:url(#wash)}
.paper .mini{position:absolute;top:10px;right:14px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4475a,#8a1c2b 65%);display:grid;place-items:center;font-family:var(--f-display);color:#f3c9c4;font-size:16px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.paper h3{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--wine);margin:0 0 12px;text-align:center;position:relative}
.paper .txt{white-space:pre-wrap;font-size:17px;line-height:1.85;color:var(--ink);min-height:120px;position:relative}
.paper .sign{margin-top:14px;text-align:right;font-family:var(--f-display);font-size:23px;color:var(--wine);opacity:0;transition:opacity 1s}
.paper .sign.on{opacity:1}
.miniEnv{width:min(70vw,260px);aspect-ratio:3/2;position:relative;background:#f2e8dc;box-shadow:0 14px 28px rgba(74,42,44,.22);border-radius:3px;display:grid;place-items:center}
.miniEnv::before{content:"";position:absolute;inset:0;background:#e6d8c7;clip-path:polygon(0 0,100% 0,50% 58%)}
.miniEnv .seal{position:relative;top:-8%;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4475a,#8a1c2b 62%,#5f1220);box-shadow:0 3px 8px rgba(0,0,0,.35);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:#f3c9c4;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* wishes on a ribbon line */
.wishes{width:100%;max-width:390px;display:flex;flex-direction:column;gap:28px;padding:10px 0}
.wrow{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:26px}
.wrow::before{content:"";position:absolute;left:-24px;right:-24px;top:8px;height:5px;background:linear-gradient(#b42a3c,#8a1c2b);border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.2);transform:rotate(-1.2deg)}
.note{position:relative;background:#fbf5ec;padding:20px 12px 14px;box-shadow:0 6px 14px rgba(74,42,44,.2);font-size:14.5px;line-height:1.6;min-width:0;overflow-wrap:anywhere;opacity:0;animation:rise .7s forwards;clip-path:polygon(0 0,100% 0,100% 98%,94% 100%,86% 98.5%,76% 100%,66% 98.6%,55% 100%,45% 98.5%,34% 100%,24% 98.6%,13% 100%,5% 98.6%,0 100%)}
.note:nth-child(odd){transform:rotate(-1.6deg)}
.note:nth-child(even){transform:rotate(1.4deg)}
.note::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:34px;margin-left:-6px;border-radius:3px;background:linear-gradient(90deg,#c79a63,#9a7040);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.note em{display:block;margin-top:8px;font-style:normal;font-family:var(--f-display);font-size:17px;color:var(--wine);text-align:right}

/* gifts */
.gifts{display:flex;flex-direction:column;gap:18px;width:100%;max-width:370px}
.gift{position:relative;padding:5px;background:linear-gradient(135deg,#d9bf8e,#b08d57 50%,#d9bf8e);text-align:center;transition:transform .25s;width:100%;
  -webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.gift .in{background:#fbf5ec;padding:20px 22px;min-height:104px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.gift .gt{font-family:var(--f-display);font-size:26px;color:var(--wine);line-height:1.3}
.gift .gd{font-size:15px;color:var(--ink-soft);line-height:1.6;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s,opacity .5s}
.gift .tap{font-family:var(--f-ui);font-size:13px;color:var(--gold)}
.gift.open .gd{max-height:200px;opacity:1}
.gift.open .tap{display:none}
.end p{font-family:var(--f-display);font-size:30px;color:var(--wine);margin:0;text-align:center;line-height:1.5}

/* admin + login */
#admin{position:fixed;inset:0;z-index:80;background:var(--paper);overflow-y:auto;font-family:var(--f-ui);color:var(--ink)}
#admin[hidden]{display:none}
.loginbox{max-width:380px;margin:0 auto;padding:12vh 20px 40px;display:flex;flex-direction:column;gap:14px}
.loginbox h1{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;text-align:center;color:var(--wine)}
.loginbox label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink-soft)}
.loginbox input,.adm input[type=text],.adm input[type=date],.adm textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid #e1cfc6;border-radius:9px;padding:10px 12px;width:100%;min-width:0}
.loginbox input:focus,.adm input:focus,.adm textarea:focus{outline:none;border-color:var(--wine)}
.adm{max-width:560px;margin:0 auto;padding-block:20px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.adm h1{font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--wine);margin:0}
.adm .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.adm .sub{color:var(--ink-soft);font-size:14px;margin:0 0 16px;line-height:1.6}
.adm fieldset{border:0;margin:0 0 18px;padding:16px;background:#fffaf4;border-radius:12px;box-shadow:0 0 0 1px rgba(138,28,43,.14);display:flex;flex-direction:column;gap:12px;min-width:0}
.adm legend{padding:0 6px;font-weight:600;color:var(--wine);font-size:15px;letter-spacing:.02em}
.adm label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink-soft)}
.adm textarea{resize:vertical;min-height:140px;line-height:1.7}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:8px 16px;border-radius:99px;background:#fffaf4;box-shadow:0 0 0 1.5px #e1cfc6;font-size:15px}
.chip.on{background:var(--wine);color:#fff;box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding-bottom:12px;border-bottom:1px dashed #e1cfc6}
.item:last-child{border:0;padding:0}
.item .f{display:flex;flex-direction:column;gap:8px;min-width:0}
.x{width:36px;height:36px;border-radius:50%;background:#f1dcd6;color:var(--wine);font-size:18px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px}
.small{font-size:13px;color:var(--ink-soft);line-height:1.5}
.linkbox{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px dashed #d8bfb4;border-radius:9px;padding:8px 10px;font-size:14px;word-break:break-all;min-width:0}
.sharebtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.sharebtns .btn{padding:10px 12px;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:2;background:rgba(247,239,232,.96);backdrop-filter:blur(6px);border-top:1px solid #e1cfc6;padding:12px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.msg{font-size:14px;text-align:center;width:100%;min-height:20px;color:var(--ink-soft)}
.msg.err{color:#a3141f}
.danger{color:#a3141f!important;box-shadow:inset 0 0 0 1.5px #a3141f!important}

body[data-th=pink]{--wine:#a8325e;--rose:#cf4b78;--blush:#f2cfdb}
body[data-th=gold]{--wine:#7a5516;--rose:#a77a22;--blush:#ecd9ae}
body[data-th=night]{--paper:#26161a;--ink:#f1dfd8;--ink-soft:#c9a9a4;--wine:#f0a8b3;--rose:#e0596a;--blush:#4a2a30;--night:#0f0709}
body[data-th=night] .btn{background:#8a1c2b;color:#fff3ee}
body[data-th=night] .btn.ghost{background:transparent;color:var(--wine)}
body[data-th=night] .paper,body[data-th=night] .note,body[data-th=night] .grid .pl,body[data-th=night] .lb figure,body[data-th=night] .env .card,body[data-th=night] .scr,body[data-th=night] .iconbtn{background:#3a232b}
body[data-th=night] .paper .txt,body[data-th=night] .env .card span{color:var(--ink)}
#admin{--paper:#f7efe8;--ink:#4a2a2c;--ink-soft:#7d5a5a;--wine:#8a1c2b;--rose:#b42a3c;--blush:#e9cdc6}
.fx-warm img,img.fx-warm{filter:sepia(.35) saturate(1.25) contrast(1.05)}
.fx-bw img,img.fx-bw{filter:grayscale(1) contrast(1.1)}
.fx-vintage img,img.fx-vintage{filter:sepia(.65) contrast(.95) brightness(1.05) hue-rotate(-8deg)}
.fx-soft img,img.fx-soft{filter:brightness(1.07) saturate(1.1) contrast(.92)}
.fr-gold .pl{background:linear-gradient(135deg,#d9bf8e,#b08d57 50%,#d9bf8e)!important;padding:5px 5px 30px!important}
.fr-gold .pl b{color:#4a2a2c!important}
.fr-clean .pl{background:none!important;padding:0!important;border-radius:16px;overflow:hidden}
.fr-clean .pl b{left:0!important;right:0!important;bottom:0!important;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff!important}
.scr{position:relative;width:min(300px,84vw);height:170px;border-radius:14px;background:#fffaf4;box-shadow:0 8px 22px rgba(74,42,44,.25);overflow:hidden;margin:10px auto}
.scrmsg{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-family:var(--f-display);font-size:22px;line-height:1.5;color:var(--wine)}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .8s}
.scr canvas.done{opacity:0;pointer-events:none}
.react{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:320px;margin-top:8px}
.rx{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rx button{width:46px;height:46px;border-radius:50%;font-size:24px;background:rgba(138,28,43,.08);transition:transform .2s,background .2s}
.rx button[aria-pressed=true]{background:rgba(138,28,43,.25);transform:scale(1.15);box-shadow:inset 0 0 0 2px var(--wine)}
.react textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.7);border:1.5px solid #e1cfc6;border-radius:12px;padding:10px 12px;resize:none}
body[data-th=night] .react textarea{background:#3a232b;border-color:#5a3a42}
.adm select{margin:0}
.photo.cutready{touch-action:none;cursor:ew-resize}
.halves{position:absolute;inset:0}
.halves .h{position:absolute;inset:0;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.halves .h svg{width:100%;height:100%;display:block}
.halves .l{clip-path:inset(0 50% 0 0)}.halves .r{clip-path:inset(0 0 0 50%)}
.halves.split .l{transform:translateX(-9px) rotate(-2deg)}.halves.split .r{transform:translateX(9px) rotate(2deg)}
.knife{position:absolute;left:50%;top:-30px;font-size:34px;line-height:1;margin-left:-17px;z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.knife.go{animation:knf .7s ease-in forwards}
@keyframes knf{to{transform:translateY(230px) rotate(8deg);opacity:.2}}

.paper .txt.hand{font-family:'Atma','Galada',cursive;font-size:20px;line-height:36px;background:repeating-linear-gradient(transparent 0 35px,rgba(138,28,43,.14) 35px 36px);background-position:0 8px}
.paper .txt.brush{font-family:'Galada','Tiro Bangla',cursive;font-size:22px;line-height:1.7}
.bpl{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;width:100%;max-width:380px;padding:8px 0 4px}
.bln{position:relative;width:62px;height:78px;border-radius:50% 50% 47% 47%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.65),transparent 28%),var(--c);box-shadow:inset -7px -9px 14px rgba(0,0,0,.2);animation:bob 3.2s ease-in-out var(--d) infinite alternate}
.bln::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:26px;background:rgba(74,42,44,.4)}
@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-10px) rotate(3deg)}}
.bln.popped{animation:popb .22s ease-out forwards;pointer-events:none}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.pnotes{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.pnote{background:#fffaf4;padding:10px 14px;box-shadow:0 5px 14px rgba(74,42,44,.2);font-size:16px;line-height:1.6;animation:noteIn .5s ease-out both}
.pnote:nth-child(odd){transform:rotate(-1.2deg)}.pnote:nth-child(even){transform:rotate(1.2deg)}
.pnote em{display:block;text-align:right;font-style:normal;font-family:var(--f-display);color:var(--wine);font-size:16px}
@keyframes noteIn{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
body[data-th=night] .pnote{background:#3a232b}
.agec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:340px}
.agec div{background:rgba(138,28,43,.08);border-radius:14px;padding:10px 4px;text-align:center}
.agec b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:34px;line-height:1.1;color:var(--wine);font-variant-numeric:tabular-nums}
.agec span{font-family:var(--f-ui);font-size:13px;color:var(--ink-soft)}
.reel{position:absolute;inset:0;z-index:70;background:#0f0709;overflow:hidden;color:#fff3ee}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:9%;background:#000;z-index:5}
.reel::before{top:0}.reel::after{bottom:0}
.rs{position:absolute;inset:0;opacity:0;transition:opacity 1s}
.rs.on{opacity:1}
.rs img{width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.rs.on img.k0{animation:kb0 4.8s ease-out forwards}.rs.on img.k1{animation:kb1 4.8s ease-out forwards}.rs.on img.k2{animation:kb2 4.8s ease-out forwards}
@keyframes kb0{from{transform:scale(1.02)}to{transform:scale(1.18) translate(-2%,-1%)}}
@keyframes kb1{from{transform:scale(1.18) translate(2%,1%)}to{transform:scale(1.02)}}
@keyframes kb2{from{transform:scale(1.1) translate(-2%,2%)}to{transform:scale(1.18) translate(2%,-2%)}}
.rs::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55));pointer-events:none}
.rc{position:absolute;left:0;right:0;bottom:13%;text-align:center;font-family:var(--f-display);font-size:26px;color:#fff3ee;text-shadow:0 2px 8px rgba(0,0,0,.8);padding:0 20px;z-index:2}
.rt{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#5a1a24,#1d0a0e 80%);padding:30px}
.rt p{margin:0;font-family:var(--f-display);font-size:42px;line-height:1.4;color:#e2c98f}
.rt small{display:block;font-family:var(--f-ui);font-size:16px;color:#e9cdc6;margin-top:10px}
.rbars{position:absolute;top:calc(9% + 8px);left:12px;right:12px;display:flex;gap:4px;z-index:6}
.rbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.rbars i b{display:block;height:100%;width:0;background:#fff}
.rbars i.done b{width:100%}
.rbars i.cur b{animation:rbar var(--d) linear forwards}
@keyframes rbar{to{width:100%}}
.rx2{position:absolute;top:calc(9% + 18px);right:12px;z-index:7;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:18px}
.cardov{position:fixed;inset:0;z-index:100;background:rgba(15,7,9,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto}
.cardov img{max-height:70vh;max-width:90vw;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.cardov .hint{color:#e9cdc6}
.cpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;width:100%}
.cpick button{padding:0;border-radius:8px;overflow:hidden;aspect-ratio:3/4;background:#000}
.cpick img{width:100%;height:100%;object-fit:cover;display:block}

.hb .paper{animation:hbs 2.4s ease-in-out infinite}
.hb .miniEnv{animation:hbs 2.4s ease-in-out infinite}
.hb .paper .mini{animation:hbm 2.4s ease-in-out infinite}
@keyframes hbs{0%,100%{box-shadow:0 12px 30px rgba(74,42,44,.2),0 0 0 0 rgba(224,60,80,0)}14%{box-shadow:0 12px 30px rgba(74,42,44,.2),0 0 34px 6px rgba(224,60,80,.5)}28%{box-shadow:0 12px 30px rgba(74,42,44,.2),0 0 12px 1px rgba(224,60,80,.15)}42%{box-shadow:0 12px 30px rgba(74,42,44,.2),0 0 44px 10px rgba(224,60,80,.55)}70%{box-shadow:0 12px 30px rgba(74,42,44,.2),0 0 0 0 rgba(224,60,80,0)}}
@keyframes hbm{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(1.04)}42%{transform:scale(1.26)}70%{transform:scale(1)}}
.dayq{max-width:320px;text-align:center;font-family:var(--f-text);font-style:italic;font-size:15px;line-height:1.6;color:var(--ink-soft);padding:8px 14px;border-top:1px solid rgba(176,141,87,.5);border-bottom:1px solid rgba(176,141,87,.5);animation:noteIn .8s ease-out both}
.dayq small{display:block;font-style:normal;font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;color:#b08d57;margin-bottom:2px}
.bqtray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:330px}
.bqtray button{width:54px;height:54px;padding:0;border-radius:50%;background:none;transition:transform .2s,opacity .3s}
.bqtray button svg{width:100%;height:100%}
.bqtray button:active{transform:scale(.85)}
.bqtray button.used{opacity:.15;pointer-events:none}
.bq{position:relative;width:260px;height:230px;margin:0 auto}
.bq .stem{position:absolute;left:50%;bottom:34px;width:0;height:150px;transform-origin:50% 100%;animation:grow .6s ease-out both}
.bq .stem::before{content:"";position:absolute;left:-1.5px;bottom:0;width:3px;height:100%;background:linear-gradient(#4f6a35,#3e4a2b);border-radius:2px}
.bq .stem svg{position:absolute;left:-26px;top:-26px;width:52px;height:52px}
@keyframes grow{from{height:0;opacity:0}to{height:150px;opacity:1}}
.bq .wrap{position:absolute;left:50%;bottom:0;margin-left:-62px;width:124px;height:92px;background:linear-gradient(135deg,#f3e6d6,#e8d3bb);clip-path:polygon(0 0,100% 0,62% 100%,38% 100%);z-index:2;box-shadow:inset 0 0 0 1px rgba(176,141,87,.5)}
.bq .bowx{position:absolute;left:50%;bottom:28px;width:52px;margin-left:-26px;z-index:3}
body[data-th=night] .bq .wrap{background:linear-gradient(135deg,#6a4a4f,#4a2e34)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
/* ===== cards ===== */
@keyframes kin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kpop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes kshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes kstamp{from{opacity:0;transform:scale(2.4) rotate(-12deg)}to{opacity:.85;transform:scale(1) rotate(-12deg)}}
body[data-kind]:not([data-kind=story]) :is(.rose,.deco){display:none}
body[data-kind]:not([data-kind=story]) .mid :is(input[type=text],textarea){width:100%;max-width:340px;font-family:var(--f-ui);font-size:16px;padding:10px 14px;border-radius:12px;border:1.5px solid rgba(120,80,60,.4);background:rgba(255,255,255,.85);color:#3a2224}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.seg button{padding:10px 16px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--wine);color:var(--wine);font-family:var(--f-ui)}.seg button[aria-pressed=true]{background:var(--wine);color:var(--paper)}
.step{display:flex;align-items:center;gap:12px;font-family:var(--f-ui)}.step button{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--wine);font-size:22px;color:var(--wine)}.step span{font-size:22px;min-width:30px;text-align:center}
.ed-big,.bk-big{font-size:34px;text-align:center;font-family:var(--f-display);line-height:1.35}
.ed-from{text-align:center;font-family:var(--f-ui);font-size:17px;color:var(--ink-soft)}
/* wedding */
body[data-kind=wedding]{--paper:#f6ecd9;--ink:#4b2a1f;--ink-soft:#7a5b45;--wine:#7a1426;--rose:#9b2236;--gold:#b8872e;--blush:#ecd6b0}
body[data-kind=wedding] .phone{background:radial-gradient(ellipse at 50% 0,#fff8e8,#f1e2c0)}
.wd-cover{gap:26px}
.doors{position:relative;width:min(300px,76vw);aspect-ratio:3/4.2;perspective:1100px;cursor:pointer;border-radius:140px 140px 10px 10px;background:radial-gradient(circle at 50% 40%,#fff3cf,#e6c883);box-shadow:0 18px 40px rgba(60,20,20,.35),inset 0 0 0 6px #b8872e}
.doors i{position:absolute;top:0;bottom:0;width:50%;z-index:2;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 6px,transparent 6px 12px),linear-gradient(135deg,#8a1a2d,#5d0f1e);box-shadow:inset 0 0 0 4px #c9993f;transition:transform 1.3s cubic-bezier(.6,.1,.2,1)}
.doors i:after{content:'';position:absolute;top:52%;width:12px;height:12px;border-radius:50%;background:#e2b866}
.doors .dl{left:0;transform-origin:left center;border-radius:140px 0 0 10px}.doors .dl:after{right:10px}
.doors .dr{right:0;transform-origin:right center;border-radius:0 140px 10px 0}.doors .dr:after{left:10px}
.doors.open .dl{transform:rotateY(-105deg)}.doors.open .dr{transform:rotateY(105deg)}
.doors .mono{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7a1426;font-family:var(--f-display);font-size:30px;line-height:1.15;text-align:center}.doors .mono b{color:#b8872e;font-weight:400}
.wd-frame{border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:-8px;padding:26px 20px;text-align:center;background:rgba(255,250,238,.7);width:100%;border-radius:4px}
.wd-top{font-family:var(--f-ui);letter-spacing:.3em;font-size:13px;color:var(--gold)}
.wd-names{font-family:var(--f-display);font-size:38px;line-height:1.25;color:var(--wine);font-weight:400;display:flex;flex-direction:column}.wd-names em{color:var(--gold);font-size:26px}
.wd-ph{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);margin:8px auto;display:block}
.wd-fam{font-family:var(--f-ui);font-size:15px;color:var(--ink-soft);margin:8px 0}.wd-date{font-weight:600;color:var(--wine);font-size:20px}
.cdw{display:flex;gap:8px;justify-content:center;margin-top:12px}.cdw span{min-width:54px;padding:6px 4px;border:1px solid var(--gold);border-radius:6px;display:flex;flex-direction:column;font-family:var(--f-ui)}.cdw b{font-size:22px;color:var(--wine)}.cdw small{font-size:11px}
.wd-paper{border:1px solid var(--gold);padding:26px 20px;background:rgba(255,250,238,.75);text-align:center;border-radius:4px;width:100%}.wd-bless{font-style:italic;font-size:17px}.wd-msg{font-size:18px}
.wd-thx{font-family:var(--f-display);font-size:26px;color:var(--wine)}
.tl{display:flex;flex-direction:column;gap:18px;width:100%;position:relative;padding-left:22px}.tl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--gold)}
.tli{display:flex;gap:12px;position:relative}.scene.on .tli{animation:kin .6s both;animation-delay:calc(var(--i)*.25s + .6s)}
.tli>i{position:absolute;left:-22px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--wine);box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--gold)}
.tli div{display:flex;flex-direction:column;font-family:var(--f-ui);font-size:15px}.tli b{font-size:19px;color:var(--wine)}.tli a{color:var(--wine)}
/* dark kinds shared */
body[data-kind=invite],body[data-kind=eid],body[data-kind=result],body[data-kind=love]{color:var(--ink)}
:is(body[data-kind=invite],body[data-kind=eid],body[data-kind=result],body[data-kind=love]) .btn{background:var(--gold);color:#10201a}
:is(body[data-kind=invite],body[data-kind=eid],body[data-kind=result],body[data-kind=love]) .btn.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
:is(body[data-kind=invite],body[data-kind=eid],body[data-kind=result],body[data-kind=love]) .foil{background:linear-gradient(120deg,var(--gold),#fff6d6,var(--gold));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
:is(body[data-kind=invite],body[data-kind=eid],body[data-kind=result],body[data-kind=love]) .seg button{color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
:is(body[data-kind=invite],body[data-kind=eid],body[data-kind=result],body[data-kind=love]) .seg button[aria-pressed=true]{background:var(--gold);color:#10201a}
/* invite */

function convTone(t,from,to){if(!t||from===to)return t;const ix={tumi:0,apni:1,tui:2},m={};PAIRS.forEach(r=>{const f=r[ix[from]];if(!BADK[from].includes(f)&&!(f in m))m[f]=r[ix[to]]});const ks=Object.keys(m).sort((a,b)=>b.length-a.length);if(!ks.length)return t;return t.replace(new RegExp(ks.join('|'),'g'),k=>m[k])}

  <button class="btn ghost danger" id="delp" style="width:100%">এই ব্যক্তিকে মুছে ফেলো</button>`):'<p class="sub">কেউ নেই, নতুন যোগ করো।</p>'}
  </div><div class="bar"><div class="msg" id="msg"></div><button class="btn ghost" id="prev">প্রিভিউ</button><button class="btn" id="save">সংরক্ষণ করো</button></div>`;
  refreshShare();setMsg(msgText,msgErr);bindAdmin();
}
function pull(){const p=DATA.people[ei];if(p&&isCard(p)){pullCard(p);return}if(!p||!$('#f-name',adm))return;const g=id=>$(id,adm).value;
  p.name=g('#f-name').trim();p.birth=g('#f-birth');p.call=g('#f-call').trim();p.from=g('#f-from').trim();
  p.slug=(g('#f-slug')||'').toLowerCase().replace(/[^a-z0-9-]/g,'')||p.slug;p.lock=$('#f-lock',adm).checked;p.tone=$('#f-tone',adm).value;p.unlockAt=$('#f-unlock',adm).value;p.age=g('#f-age').replace(/\D/g,'').slice(0,3);p.nomusic=$('#f-nomusic',adm).checked;p.letter=g('#f-letter');p.theme=$('#f-theme',adm).value;p.filter=$('#f-filter',adm).value;p.frame=$('#f-frame',adm).value;p.rain=$('#f-rain',adm).checked;p.scratch=g('#f-scr').trim();p.reply=g('#f-reply').trim();p.closing=g('#f-closing').trim();p.hand=$('#f-hand',adm).value;p.occ=$('#f-occ',adm).value;p.ctitle=g('#f-ctitle').trim();p.cen=g('#f-cen').trim();p.wmode=$('#f-wmode',adm).value;p.agectr=$('#f-agectr',adm).checked;p.bouquet=$('#f-bouquet',adm).checked;p.hb=$('#f-hb',adm).checked;p.dayq=$('#f-dayq',adm).checked;p.msgs=g('#f-msgs').trim();p.draft=$('#f-draft',adm).checked;
  adm.querySelectorAll('[data-w]').forEach(e=>{p.wishes[+e.dataset.w][e.dataset.f]=e.value});
  adm.querySelectorAll('[data-g]').forEach(e=>{p.gifts[+e.dataset.g][e.dataset.f]=e.value});
  adm.querySelectorAll('[data-ph]').forEach(e=>{p.photos[+e.dataset.ph].cap=e.value})}
function bindAdmin(){
  const p=DATA.people[ei];
  $('#closeA',adm).onclick=()=>{pull();closeAdmin();renderStory()};
  adm.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{pull();ei=+b.dataset.chip;renderAdmin()});
  $('#addp',adm).onclick=()=>{pull();let n=DATA.people.length+1,s='guest'+n;while(findPerson(s))s='guest'+(++n);DATA.people.push({slug:s,name:'',birth:'',from:(p&&p.from)||'',call:'',lock:false,letter:'',wishes:[],photos:[],photo:'',age:'',music:null,voice:null,tone:'tumi',unlockAt:'',nomusic:false,gifts:[]});ei=DATA.people.length-1;renderAdmin()};
  if(!p)return;
  if(isCard(p)){bindCard(p);return}
  $('#f-kind',adm).onchange=e=>setKind(p,e.target.value);
  ['#f-name','#f-slug'].forEach(i=>$(i,adm).addEventListener('input',refreshShare));
  $('#f-msg',adm).addEventListener('input',e=>{e.target.dataset.dirty='1';refreshShare()});
  $('#mkcard',adm).onclick=e=>{pull();pickCard(p,e.currentTarget)};
  $('#cp',adm).onclick=()=>{pull();navigator.clipboard.writeText(shareLink(p)).then(()=>setMsg('লিংক কপি হয়েছে')).catch(()=>setMsg('কপি হয়নি, লিংকটা চেপে ধরে কপি করো',true))};
  $('#cpm',adm).onclick=()=>{navigator.clipboard.writeText($('#f-msg',adm).value).then(()=>setMsg('মেসেজ কপি হয়েছে')).catch(()=>{$('#f-msg',adm).select();setMsg('কপি হয়নি, লেখাটা সিলেক্ট করা আছে, কপি করে নাও',true)})};
  $('#addw',adm).onclick=()=>{pull();p.wishes.push({from:p.from||'',text:''});renderAdmin()};
  adm.querySelectorAll('[data-delw]').forEach(b=>b.onclick=()=>{pull();p.wishes.splice(+b.dataset.delw,1);renderAdmin()});
  $('#addg',adm).onclick=()=>{pull();p.gifts.push({title:'',text:''});renderAdmin()};
  adm.querySelectorAll('[data-delg]').forEach(b=>b.onclick=()=>{pull();p.gifts.splice(+b.dataset.delg,1);renderAdmin()});
  adm.querySelectorAll('[data-delph]').forEach(b=>b.onclick=()=>{pull();p.photos.splice(+b.dataset.delph,1);renderAdmin()});
  $('#duptone',adm).value=p.tone||'tumi';$('#f-occ',adm).addEventListener('change',()=>{$('#occx',adm).hidden=$('#f-occ',adm).value!=='custom';const t=$('#f-msg',adm);delete t.dataset.dirty;refreshShare()});
  ['#f-ctitle'].forEach(i=>$(i,adm).addEventListener('input',()=>{const t=$('#f-msg',adm);delete t.dataset.dirty;refreshShare()}));
  const tsel=$('#f-tone',adm);tsel.dataset.prev=tsel.value;
  tsel.addEventListener('change',()=>{const t=$('#f-msg',adm);delete t.dataset.dirty;refreshShare();$('#convt',adm).hidden=tsel.value===tsel.dataset.prev});
  $('#convt',adm).onclick=()=>{const from=tsel.dataset.prev,to=tsel.value;pull();const c=t=>convTone(t,from,to);p.letter=c(p.letter);p.wishes.forEach(w=>{w.text=c(w.text)});p.gifts.forEach(g=>{g.title=c(g.title);g.text=c(g.text)});if(p.scratch)p.scratch=c(p.scratch);renderAdmin();setMsg('লেখা নতুন সম্বোধনে বদলানো হয়েছে, একবার পড়ে দেখো')};
  $('#bulkgo',adm).onclick=()=>{pull();const lines=$('#bulk',adm).value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length){setMsg('অন্তত একজনের নাম লেখো',true);return}let n=DATA.people.length+1,first=-1,made=0;
    for(const ln of lines){const [nm,bd,cl]=ln.split('|').map(x=>x.trim());if(!nm)continue;const c=JSON.parse(JSON.stringify(p));let sl='guest'+n;while(findPerson(sl))sl='guest'+(++n);n++;c.slug=sl;c.name=nm;c.birth=/^\d{4}-\d{2}-\d{2}$/.test(bd||'')?bd:'';c.call=cl||'';c.photo='';c.photos=[];c.voice=null;c.draft=true;c.letter=(c.letter||'').replace(/^\s*প্রিয়[^\n]*/,'প্রিয় '+(c.call||nm)+',');DATA.people.push(c);if(first<0)first=DATA.people.length-1;made++}
    if(made){ei=first;renderAdmin();setMsg(made+'টি পেজ ড্রাফট হিসেবে তৈরি হয়েছে, নিজের মতো বদলে ড্রাফট বন্ধ করো')}};
  $('#sample',adm).onclick=function(){if(this.dataset.sure!=='1'){this.dataset.sure='1';this.textContent='নিশ্চিত? চিঠি, শুভেচ্ছা, উপহার বদলে যাবে, আবার চাপো';return}pull();const t=TPL[p.tone]||TPL.tumi;{const oo=occ(p);p.letter='প্রিয় '+(p.call||p.name||'')+',\n\n'+(oo.letter?convTone(oo.letter,'tumi',p.tone||'tumi'):t.letter)}p.wishes=t.wishes.map(x=>({from:p.from||'',text:x}));p.gifts=t.gifts.map(([a,b])=>({title:a,text:b}));p.scratch=t.scr;renderAdmin();setMsg('নমুনা লেখা বসানো হয়েছে, নিজের মতো বদলে নাও')};
  $('#addvoice',adm).onclick=()=>$('#f-voice',adm).click();
  $('#f-voice',adm).onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>3e6){setMsg('ভয়েসটা ৩ MB-এর বেশি বড়, ছোট ফাইল দাও',true);return}pull();setMsg('ভয়েস যোগ হচ্ছে...');const fr=new FileReader();fr.onerror=()=>setMsg('ফাইলটা পড়া যায়নি',true);fr.onload=()=>{p.voice={name:f.name,src:fr.result};renderAdmin();setMsg('ভয়েস যোগ হয়েছে, সংরক্ষণ করতে ভুলো না')};fr.readAsDataURL(f)};
  const dv=$('#delvoice',adm);if(dv)dv.onclick=()=>{pull();p.voice=null;renderAdmin()};
  $('#dupp',adm).onclick=()=>{pull();const c=JSON.parse(JSON.stringify(p));let k=2,sl=p.slug+'-copy';while(findPerson(sl))sl=p.slug+'-copy'+(k++);c.slug=sl;c.name=(p.name||'')+' (কপি)';c.draft=true;const to=$('#duptone',adm).value,fr=p.tone||'tumi';c.tone=to;if(to!==fr){const cv2=t=>convTone(t,fr,to);c.letter=cv2(c.letter);c.wishes.forEach(w=>{w.text=cv2(w.text)});c.gifts.forEach(g=>{g.title=cv2(g.title);g.text=cv2(g.text)});if(c.scratch)c.scratch=cv2(c.scratch)}DATA.people.push(c);ei=DATA.people.length-1;renderAdmin();setMsg('কপি তৈরি হয়েছে, নাম ও তথ্য বদলে নাও')};
  $('#addmusic',adm).onclick=()=>$('#f-music',adm).click();
  $('#f-music',adm).onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5e6){setMsg('গানটা ৫ MB-এর বেশি বড়, ছোট ফাইল দাও',true);return}pull();setMsg('গান যোগ হচ্ছে...');const fr=new FileReader();fr.onerror=()=>setMsg('গানটা পড়া যায়নি',true);fr.onload=()=>{p.music={name:f.name,src:fr.result};renderAdmin();setMsg('গান যোগ হয়েছে, সংরক্ষণ করতে ভুলো না')};fr.readAsDataURL(f)};
  const dmu=$('#delmusic',adm);if(dmu)dmu.onclick=()=>{pull();p.music=null;renderAdmin()};
  $('#addmain',adm).onclick=()=>$('#f-main',adm).click();
  $('#f-main',adm).onchange=async e=>{const f=e.target.files[0];if(!f)return;pull();setMsg('ছবি ছোট করা হচ্ছে...');try{p.photo=await shrink(f);renderAdmin();setMsg('ছবি যোগ হয়েছে, সংরক্ষণ করতে ভুলো না')}catch(x){setMsg('ছবিটা পড়া যায়নি',true)}};
  const dm=$('#delmain',adm);if(dm)dm.onclick=()=>{pull();p.photo='';renderAdmin()};
  adm.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{pull();const [i,d]=b.dataset.mv.split(':').map(Number),j=i+d;if(j<0||j>=p.photos.length)return;[p.photos[i],p.photos[j]]=[p.photos[j],p.photos[i]];renderAdmin()});
  $('#addph',adm).onclick=()=>$('#f-photos',adm).click();
  $('#f-photos',adm).onchange=async e=>{pull();setMsg('ছবি ছোট করা হচ্ছে...');for(const f of e.target.files){try{p.photos.push({src:await shrink(f),cap:''})}catch(x){setMsg('একটি ছবি পড়া যায়নি',true)}}renderAdmin();setMsg('ছবি যোগ হয়েছে, সংরক্ষণ করতে ভুলো না')};
  $('#delp',adm).onclick=function(){if(this.dataset.sure!=='1'){this.dataset.sure='1';this.textContent='নিশ্চিত? আবার চাপো';return}DATA.people.splice(ei,1);ei=0;renderAdmin()};
  $('#prev',adm).onclick=()=>{pull();adm.hidden=true;history.replaceState(null,'',location.pathname+location.search+'#'+p.slug);renderStory()};
  $('#save',adm).onclick=save;

function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const m=1000,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(file)})}
function jsonSafe(o){return JSON.stringify(o).replace(/</g,'\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029')}
function buildDoc(){
  const reset=[...document.head.querySelectorAll('style')].find(s=>!s.hasAttribute('data-k'));
  const css=reset?reset.textContent:'';
  const nodes=[...document.querySelectorAll('[data-k]')].filter(n=>n.parentElement&&n.parentElement.closest('[data-k]')==null).map(n=>{const c=n.cloneNode(true);if(c.id==='root'){c.querySelector('#app').innerHTML='';const ad=c.querySelector('#admin');ad.innerHTML='';ad.hidden=true;c.querySelector('#lb').hidden=true;c.querySelector('#gear').className='iconbtn ghost0';c.querySelector('#back').hidden=true;c.querySelector('#snd').hidden=true;c.querySelector('#snd').innerHTML='';c.querySelectorAll('.balloon').forEach(e=>e.remove());c.querySelector('#dots').innerHTML='';['#petals','#sparks'].forEach(q=>{const pc=c.querySelector(q);pc.removeAttribute('style');pc.removeAttribute('width');pc.removeAttribute('height')})}
    if(c.id==='data')c.textContent=jsonSafe(DATA);return c.outerHTML});
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+css+'</style></head><body>'+nodes.join('')+'</body></html>'}
async function save(){
  pull();const btn=$('#save',adm);
  const slugs=DATA.people.map(p=>p.slug);if(new Set(slugs).size!==slugs.length){setMsg('দুজনের লিংকের নাম একই হয়ে গেছে, একটা বদলাও',true);return}
  if(DATA.people.some(p=>!p.name)){setMsg('সবার নাম লিখতে হবে',true);return}
  if(!artifactCap){setMsg('সংরক্ষণ করতে claude.ai-তে মালিকের অ্যাকাউন্টে সাইন-ইন থাকতে হবে',true);return}
  const html=buildDoc();if(html.length>14e6){setMsg('ছবি অনেক বেশি হয়ে গেছে, কয়েকটা কমাও',true);return}
  btn.disabled=true;setMsg('সংরক্ষণ হচ্ছে...');
  try{try{sessionStorage.setItem('reopenAdmin','1:'+ei)}catch(e){}await artifactCap.publish(html);setMsg('সংরক্ষণ হয়েছে')}
  catch(e){btn.disabled=false;const c=e&&e.code;setMsg(c==='conflict'?'অন্য কোথাও বদল হয়েছে, পেজ নতুন করে লোড হবে':(c==='not_writer'||c==='not_granted')?'সংরক্ষণের অনুমতি নেই':'সংরক্ষণ হয়নি, আবার চেষ্টা করো',true)}
}

/* ---------- boot ---------- */
let taps=0,tapT=0;
$('#gear').addEventListener('click',()=>{if(logged){openAdmin();return}const n=Date.now();taps=n-tapT<1500?taps+1:1;tapT=n;if(taps>=5){taps=0;openLogin()}});
addEventListener('hashchange',()=>{if(location.hash==='#admin'){openAdmin();return}renderStory()});
size();sizeSp();requestAnimationFrame(drawSp);renderStory();
(async()=>{
  try{if(logged)$('#gear').classList.remove('ghost0');if(window.claude&&claude.use)artifactCap=await claude.use('artifact')}catch(e){}
  try{if(window.claude&&claude.use)dlCap=await claude.use('downloads')}catch(e){}
  let r=null;try{r=sessionStorage.getItem('reopenAdmin');sessionStorage.removeItem('reopenAdmin')}catch(e){}
  if(logged&&r){ei=+(r.split(':')[1]||0)||0;openAdmin()}else if(location.hash==='#admin')openAdmin();
})();
})();
